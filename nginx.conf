map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;

  # редиректы относительные: иначе nginx подставит свой внутренний порт 80 вместо HTTP_PORT
  absolute_redirect off;

  # общие настройки прокси для neko (HTTP + WebSocket сигналинга)
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_cache_bypass $http_upgrade;
  proxy_read_timeout 300s;   # neko пингует каждые 10 с, heartbeat клиента 120 с
  proxy_send_timeout 300s;

  location = / { return 302 /alice/; }

  # --- Алиса ---
  location = /alice  { return 301 /alice/; }
  location = /alice/ {
    # без параметров → режим embed: только видео, без панелей neko
    if ($args = "") { return 302 /alice/?embed=1; }
    proxy_pass http://neko-alice:8080;
    # вставляем скрипт автоподстройки разрешения в страницу neko
    proxy_set_header Accept-Encoding "";
    sub_filter '</head>' '<script src="/_fit.js"></script></head>';
    sub_filter_once on;
  }
  location /alice/   { proxy_pass http://neko-alice:8080; }

  # --- автоподстройка разрешения ---
  location = /_fit.js { alias /usr/share/nginx/fit/fit.js; add_header Cache-Control "no-cache"; }
  location /_fit/     { proxy_pass http://autofit:3000; }
}
